primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ALLOWED_ORIGIN = "https://kalidgpt-sketch.github.io"
  RATE_WINDOW_MS = "60000"
  RATE_MAX = "45"
  CACHE_TTL_MS = "120000"
  NEGATIVE_CACHE_TTL_MS = "30000"
  STALE_TTL_MS = "300000"
  CACHE_MAX_ENTRIES = "1000"
  UPSTREAM_TIMEOUT_MS = "6500"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
