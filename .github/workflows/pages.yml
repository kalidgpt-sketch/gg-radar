name: Deploy GG Radar to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build static site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp site/styles.css _site/styles.css
          cp site/data.js _site/data.js
          cp site/app.js _site/app.js
          cp site/ads.js _site/ads.js
          cp site/config.js _site/config.js
          cp site/robots.txt _site/robots.txt
          cp site/sitemap.xml _site/sitemap.xml
          cp site/privacy.html _site/privacy.html
          cp site/cookies.html _site/cookies.html
          cp site/about.html _site/about.html

          test -s _site/index.html
          grep -q "GG Radar" _site/index.html
          grep -q "Vuelve a Brawl Stars sin perderte" _site/index.html
          grep -q "GG_RADAR_API_BASE" _site/config.js
          grep -q "Privacidad" _site/privacy.html
          grep -q "Política de cookies" _site/cookies.html
          grep -q "Sobre GG Radar" _site/about.html
          test ! -e _site/ads.txt

      - name: Check production JavaScript
        run: |
          node --check site/data.js
          node --check site/app.js
          node --check site/ads.js

      - name: Check internal production links
        run: |
          grep -q 'href="./privacy.html"' _site/index.html
          grep -q 'href="./cookies.html"' _site/index.html
          grep -q 'href="./about.html"' _site/index.html
          grep -q 'https://gg-radar-api-kalid577.fly.dev' _site/config.js
          grep -q 'enabled: false' _site/config.js
          grep -q 'GG_RADAR_ADS' _site/config.js
          grep -q 'productionDomainReady: false' _site/config.js
          grep -q 'siteApproved: false' _site/config.js
          grep -q 'cmpConfigured: false' _site/config.js
          grep -q 'adsTxtPublished: false' _site/config.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
